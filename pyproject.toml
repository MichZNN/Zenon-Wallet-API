[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zenon-wallet-api"
description = "Python client for the Zenon Wallet API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MichZNN" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zenon-wallet-api = "zenon_wallet_api.cli:main"

[project.urls]
Repository = "https://github.com/MichZNN/Zenon-Wallet-API"
"Wallet API" = "https://github.com/hypercore-one/znn_walletapi_csharp"

[tool.setuptools]
packages = ["zenon_wallet_api"]

[tool.setuptools.dynamic]
version = { attr = "zenon_wallet_api.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
